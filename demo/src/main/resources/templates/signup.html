<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Sign up</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-box">
    <h1>회원가입</h1>
    <form action="/signup" method="post" class="auth-form">
      <div class="form-row">
        <label>아이디</label>
        <input type="text" name="username" th:value="${userForm.username}" required />
      </div>
      <div class="form-row">
        <label>비밀번호</label>
        <input type="password" name="password" required />
      </div>
      <div class="form-row">
        <label>이름(표시명)</label>
        <input type="text" name="name" th:value="${userForm.name}" />
      </div>
      <div class="form-row">
        <button type="submit" class="btn">회원가입</button>
      </div>
    </form>
    <div class="muted">이미 계정이 있으신가요? <a href="/login">로그인</a></div>
  </div>
  <div th:if="${error}">
    <p class="error" th:text="${error}"></p>
  </div>
</body>
</html>
