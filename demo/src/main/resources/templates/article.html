<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <title th:text="${article.title}">Article</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container article-detail">
    <h1 th:text="${article.title}">제목</h1>
    <div class="meta">
      <span th:text="${article.author}"></span>
      <span th:text="${article.createdAt}"></span>
    </div>
    <div class="content" th:utext="${article.content}"></div>
  </div>
</body>
</html>
