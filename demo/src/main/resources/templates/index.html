<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <title>gear - 홈</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <section class="hero">
    <div class="container hero-inner">
      <h1>취미 장비,
        <span>전문가가 골라드립니다</span>
      </h1>
      <p>취미별 장비를 한눈에 비교하고 빠르게 시작하세요.</p>
    </div>
  </section>

  <section class="categories container">
    <div class="grid-3">
      <div class="category-card" th:each="c : ${categories}">
        <a th:href="@{'/category/' + ${c.slug}}">
          <h3 th:text="${c.name}">카테고리</h3>
          <p th:text="${c.description}">설명</p>
        </a>
      </div>
    </div>
  </section>

  <section class="product-list container">
    <h2>최근 기사</h2>
    <div class="row">
      <div class="col-6">
        <div th:if="${session.user == null}" class="login-panel">
          <h3>로그인</h3>
          <form action="/login" method="post" class="auth-form">
            <div class="form-row">
              <input type="text" name="username" placeholder="아이디" required />
            </div>
            <div class="form-row">
              <input type="password" name="password" placeholder="비밀번호" required />
            </div>
            <div class="form-row">
              <button type="submit" class="btn">로그인</button>
            </div>
          </form>
          <div class="muted">계정이 없으신가요? <a href="/signup">회원가입</a></div>
        </div>

        <div th:if="${session.user != null}" class="account-panel">
          <h3 th:text="'안녕하세요, ' + ${session.user.name}">안녕하세요</h3>
          <a class="btn" href="/mypage">마이페이지로 이동</a>
        </div>
      </div>

      <div class="col-6">
        <ul class="article-list">
          <li th:each="a : ${articles}">
            <a th:href="@{'/article/' + ${a.slug}}">
              <h4 th:text="${a.title}">제목</h4>
              <p th:text="${a.description}"></p>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </section>

</body>
</html>
