spring.application.name=demo

# Hibernate: create/update schema for embedded DB during development/tests
spring.jpa.hibernate.ddl-auto=update
# Quote identifiers globally so reserved words like `user` are handled
spring.jpa.properties.hibernate.globally_quoted_identifiers=true



# Default to in-memory H2 for development and tests. To use MySQL, activate the `mysql` profile.
spring.datasource.url=jdbc:mysql://localhost:3306/gear?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT settings (change for production)
