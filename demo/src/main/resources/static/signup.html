<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>회원가입 - GearHub</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR';padding:24px;background:#f5f7fb}
    .card{max-width:480px;margin:40px auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
    input{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px}
    button{background:#0b5cff;color:#fff;padding:10px 14px;border-radius:6px;border:none}
    a{color:#0b5cff}
    .msg{margin-top:10px;color:#c00}
  </style>
</head>
<body>
  <div class="card">
    <h2>회원가입</h2>
    <form id="signupForm">
      <input id="name" type="text" placeholder="이름" required />
      <input id="email" type="email" placeholder="이메일" required />
      <input id="password" type="password" placeholder="비밀번호" required />
      <button type="submit">회원가입</button>
    </form>
    <p style="margin-top:12px">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
    <div id="msg" class="msg"></div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    $('signupForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const name = $('name').value, email = $('email').value, password = $('password').value;
      try{
        const res = await apiPost('/auth/signup', {name, email, password});
        localStorage.setItem('accessToken', res.accessToken);
        location.href = '/mypage.html';
      }catch(err){
        $('msg').textContent = err.message || '회원가입 실패';
      }
    });
  </script>
</body>
</html>
