# MySQL configuration - activate with -Dspring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/gear?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Allow overriding credentials via environment variables DB_USER / DB_PASS (falls back to defaults)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximum-pool-size=10
# In production/MySQL profile we avoid automatic schema updates to prevent data truncation
spring.jpa.hibernate.ddl-auto=none
