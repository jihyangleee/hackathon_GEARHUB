spring.application.name=demo

# Hibernate: create/update schema for embedded DB during development/tests
spring.jpa.hibernate.ddl-auto=update
# Quote identifiers globally so reserved words like `user` are handled
spring.jpa.properties.hibernate.globally_quoted_identifiers=true



# Default to in-memory H2 for development and tests. To use MySQL, activate the `mysql` profile.
spring.datasource.url=jdbc:mysql://localhost:3306/gear?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT settings (change for production)
app.jwt.secret=B87KQ5d4H2Uf8w5jl9WAuPb8nTAzra73HvI7d3rCmQ=
app.jwt.expiration-ms=86400000

# Gemini summarization (configure for real use)
# Set app.gemini.endpoint to the Gemini REST endpoint and app.gemini.apiKey to your API key.
app.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
app.gemini.apiKey=YOUR_API_KEY
# OpenAI: prefer environment variable OPENAI_API_KEY or property app.openai.apiKey
app.openai.apiKey=${OPENAI_API_KEY:}
