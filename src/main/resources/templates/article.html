<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <title th:text="${article.title}">Article</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container">
    <!-- Article hero (centered title + meta like 이미지2) -->
    <section class="article-hero text-center" style="padding:3.5rem 0 1.5rem;">
      <h1 th:text="${article.title}">제목</h1>
      <div class="meta" style="margin-top:0.6rem; color:var(--muted);">
        <span th:text="${article.author}">작성자</span>
        <span> · </span>
        <span th:text="${article.createdAt}">작성일</span>
      </div>
      <p class="muted" style="max-width:760px; margin:1rem auto 0;">요약: <span th:text="${summary}"></span></p>
    </section>

    <div style="border-top:1px solid rgba(15,23,42,0.04); margin-top:1.25rem;"></div>

    <!-- Article content + related equipment side card layout -->
    <div class="row" style="align-items:flex-start; gap:2.5rem; margin-top:1.75rem;">
      <div style="flex:1; min-width:360px; max-width:760px;">
        <article class="card">
          <div class="content" th:utext="${article.content}"></div>
        </article>
      </div>

      <aside style="width:320px; min-width:260px;">
        <div class="card">
          <h4 style="margin-top:0;">관련 장비</h4>
          <!-- 첫 번째 장비를 강조해서 보여줌 (이미지2 스타일) -->
          <div th:if="${equipments} != null and ${!#lists.isEmpty(equipments)}">
            <div class="equipment-card" style="flex-direction:column; align-items:center; text-align:center;">
              <div class="thumb" style="width:100%;">
                <img th:src="${equipments[0].imageUrl}" alt="장비 이미지" style="width:100%; height:auto; border-radius:8px;" />
              </div>
              <div class="meta" style="margin-top:0.8rem;">
                <h5 th:text="${equipments[0].name}">장비명</h5>
                <p class="muted" th:text="${equipments[0].description}"></p>
                <div class="price" th:text="${equipments[0].price} != null ? ${equipments[0].price} + '원' : ''" style="margin-top:0.6rem; font-weight:700; color:var(--accent);"></div>
                <div class="buy-link mt-2">
                  <a th:href="${equipments[0].purchaseUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="display:inline-block; margin-top:0.6rem;">구매 링크 →</a>
                </div>
              </div>
            </div>
          </div>
          <div th:if="${equipments} == null or ${#lists.isEmpty(equipments)}" class="muted">관련 장비 정보가 없습니다.</div>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
